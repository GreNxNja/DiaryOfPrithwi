<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>The Quiet Journal</title>
        <meta name="description" content="Slow stories about travel, tech, and culture — written between trains and bad WiFi." />
        <meta name="author" content="Prithwijit" />

        <!-- Open Graph -->
        <meta property="og:title" content="The Quiet Journal" />
        <meta property="og:description" content="Slow stories about travel, tech, and culture — written between trains and bad WiFi." />
        <meta property="og:type" content="website" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="/Zen.png" />
    </head>

    <body>
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("theme");
                    var dark =
                        stored === "dark" ||
                        (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    if (dark) document.documentElement.classList.add("dark");
                } catch (e) {}
            })();
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
